<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0b09" />
  <meta name="robots" content="noindex" />
  <title>A Dead End</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23120f0c'/%3E%3Cg fill='none' stroke='%23d9a441' stroke-width='5' stroke-linecap='round'%3E%3Ccircle cx='22' cy='22' r='10'/%3E%3Cpath d='M29 29 L40 40'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap" rel="stylesheet" />
  <style>
    /* A page for the half-links: nothing here points to the real address. */
    :root {
      --stone-0: #0d0b09; --stone-1: #17130f; --stone-2: #241d17; --stone-3: #3a3027;
      --gold: #d9a441; --text: #ecdcbc; --faint: #a8977a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--stone-0);
      color: var(--text);
      font-family: 'IM Fell English', Georgia, serif;
      overflow: hidden;
    }
    .dungeon {
      position: relative; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at 50% 120%, rgba(0,0,0,0) 0%, rgba(0,0,0,.75) 70%),
        repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 2px, transparent 2px 46px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 2px, transparent 2px 92px),
        linear-gradient(180deg, var(--stone-2), var(--stone-1) 60%, var(--stone-0));
    }
    .torch {
      position: fixed; top: -10vh; width: 60vmax; height: 60vmax; pointer-events: none;
      background: radial-gradient(circle, rgba(224,112,42,.22) 0%, rgba(224,112,42,.08) 35%, transparent 65%);
      animation: flicker 3.2s infinite ease-in-out;
    }
    .torch.left { left: -30vmax; }
    .torch.right { right: -30vmax; animation-delay: -1.7s; }
    @keyframes flicker {
      0%, 100% { opacity: .85; transform: scale(1); }
      20% { opacity: 1; transform: scale(1.03); }
      45% { opacity: .7; transform: scale(.98); }
      80% { opacity: .78; transform: scale(1.02); }
    }
    .card { position: relative; z-index: 1; text-align: center; max-width: 640px; }
    .key { width: min(230px, 55vw); height: auto; margin-bottom: 18px; animation: rise 1.2s ease both; }
    .key .half { transform-origin: 50% 50%; animation: wobble 5s ease-in-out 1.2s infinite; }
    @keyframes wobble { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(3deg); } }
    h1 {
      /* Cinzel, not the blackletter: in blackletter the "O" of "Oops" reads as a "D" */
      font-family: 'Cinzel', Georgia, serif; font-weight: 700; letter-spacing: .02em;
      font-size: clamp(34px, 7.2vw, 70px); line-height: 1.12; margin: 0; text-wrap: balance;
      color: var(--gold); text-shadow: 0 0 18px rgba(217,164,65,.35), 0 3px 0 #000;
      animation: rise 1.2s ease .3s both;
    }
    p {
      font-style: italic; font-size: clamp(19px, 3.6vw, 27px); line-height: 1.45; margin: 22px 0 0;
      color: var(--text); animation: rise 1.4s ease 1.4s both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <div class="dungeon">
    <div class="torch left" aria-hidden="true"></div>
    <div class="torch right" aria-hidden="true"></div>
    <main class="card">
      <!-- half a key: the bow and part of the shaft, snapped off -->
      <svg class="key" viewBox="0 0 240 120" aria-hidden="true">
        <defs>
          <linearGradient id="iron" x1="0" y1="0" x2="0.2" y2="1">
            <stop offset="0" stop-color="#c9b48a" /><stop offset=".45" stop-color="#8d7650" /><stop offset="1" stop-color="#3b2e1d" />
          </linearGradient>
        </defs>
        <g class="half">
          <circle cx="60" cy="60" r="44" fill="url(#iron)" />
          <circle cx="60" cy="60" r="19" fill="#120f0c" />
          <circle cx="60" cy="60" r="38" fill="none" stroke="#e8d4a8" stroke-opacity=".35" stroke-width="2" />
          <rect x="98" y="46" width="14" height="28" rx="2" fill="url(#iron)" />
          <!-- the shaft ends in a jagged break -->
          <path d="M108 50 H168 L174 55 L166 60 L176 65 L168 70 H108 Z" fill="url(#iron)" />
          <path d="M120 54 l6 6 l-6 6 M134 54 l6 6 l-6 6 M148 54 l6 6 l-6 6" fill="none" stroke="#2b2013" stroke-width="3" />
        </g>
      </svg>
      <h1>Oops! You reached a dead end</h1>
      <p>So close! (Maybe change who goes first...?)</p>
    </main>
  </div>
</body>
</html>
